volumes:
  geo-db-data:

services:
  db:
    image: kartoza/postgis:${POSTGRES_MAJOR_VERSION}-${POSTGIS_MAJOR_VERSION}.${POSTGIS_MINOR_RELEASE}
    container_name: db
    hostname: db
    volumes:
      - ${PWD}/geo-db-data:/var/lib/postgresql
      - /tmp:/shps
    ports:
      - ${POSTGRES_PORT}:5432
    environment:
      - RUN_AS_ROOT=${RUN_AS_ROOT}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASS=${POSTGRES_PASS}
      - POSTGRES_UID=${POSTGRES_UID}
      - POSTGRES_GID=${POSTGRES_GID}
      - POSTGRES_MULTIPLE_EXTENSIONS=postgis,hstore,postgis_topology,postgis_raster
      - ALLOW_IP_RANGE=all
      - FORCE_SSL=FALSE
    logging:
      options:
        max-size: "120m"
        max-file: "8"
    # installs postgis client utilities (shp2pgsql) on container startup
    entrypoint: >
      sh -c "apt-get update && apt-get install -y postgis && /scripts/docker-entrypoint.sh"
    restart: always
    healthcheck:
      test: "PGPASSWORD=${POSTGRES_PASS} pg_isready -h 127.0.0.1 -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
